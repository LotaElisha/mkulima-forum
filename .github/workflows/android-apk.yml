name: Android APK

# Builds an installable APK of the Flutter app and attaches it to the run as
# a downloadable artifact.
#
# With the four ANDROID_* repository secrets set, this produces a signed
# release APK. Without them it produces a *test* APK in profile mode (AOT
# compiled, so it runs at full speed) signed with the debug key. A test APK is
# for sideloading onto phones only: the Play Store rejects debug-signed builds,
# and the release build type still refuses to sign without key.properties.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'mkulima_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkulima_app
    env:
      API_URL: https://mkulimaforum.app/api
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get

      - name: Write release signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL"
          mv build/app/outputs/flutter-apk/app-release.apk "mkulima-forum-${GITHUB_SHA::7}-release.apk"

      - name: Build test APK (debug-signed, not for the Play Store)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          flutter build apk --profile --dart-define=API_URL="$API_URL"
          mv build/app/outputs/flutter-apk/app-profile.apk "mkulima-forum-${GITHUB_SHA::7}-test.apk"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: mkulima-forum-apk
          path: mkulima_app/mkulima-forum-*.apk
          if-no-files-found: error
          retention-days: 30
