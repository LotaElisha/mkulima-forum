# Mkulima Forum — Nginx site for the VPS.
# Install: see DEPLOYMENT_RUNBOOK.md. Certbot adds the TLS server afterwards.
# PHP sets the security headers. Do not duplicate them here.

server {
    listen 80;
    listen [::]:80;
    server_name mkulimaforum.com www.mkulimaforum.com;

    root /opt/data/projects/mkulima-forum/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
