# Mkulima Forum — Nginx site for the VPS.
# Install: see DEPLOYMENT_RUNBOOK.md. Certbot adds the TLS server afterwards.
# PHP sets the security headers. Do not duplicate them here.

server {
    listen 80;
    listen [::]:80;
    # One checkout serves staging (.app) and production (.com). Certbot adds
    # the TLS server afterwards; keep these names on that server too.
    server_name mkulimaforum.com www.mkulimaforum.com mkulimaforum.app www.mkulimaforum.app;

    root /opt/data/projects/mkulima-forum/public;
    index index.php;

    client_max_body_size 20m;

    # Filament is Laravel at /admin. A leftover public/admin directory (the
    # old React build) makes the prefix location below treat /admin as a
    # folder. With no index.php inside it, Nginx returns 403 and the panel
    # never runs. This prefix wins over that directory and over the regex
    # PHP location; the rewrite then hands the original request to index.php.
    location ^~ /admin {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
