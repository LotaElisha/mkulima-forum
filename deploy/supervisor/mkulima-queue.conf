; Mkulima Forum queue worker.
; Mail (verification, password reset) is queued. Nothing sends until this runs.
; The connection is hardcoded to "database" so a REDIS line in .env cannot
; silently point the worker at a service that is not installed yet.
; After Redis is actually running, change the argument and reload supervisor.

[program:mkulima-queue]
process_name=%(program_name)s
command=/usr/bin/php /opt/data/projects/mkulima-forum/artisan queue:work database --sleep=1 --tries=3 --max-time=3600
directory=/opt/data/projects/mkulima-forum
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/mkulima-queue.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
